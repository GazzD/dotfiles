# ──────────────────────────────────────────
#  Starship — Tokyo Night palette
#  Compartido entre Zsh y Fish
# ──────────────────────────────────────────
add_newline = true
command_timeout = 500

# Orden de la primera línea
format = """
[](#565f89)\
$time\
$directory\
$git_branch\
$git_status\
$fill\
$line_break\
$status\
$character"""

# ── Orden de la línea derecha (info secundaria)
right_format = "$nodejs$python$rust$golang$cmd_duration"

# ── Character principal ─────────────────────
[character]
success_symbol = "[❯](bold #7dcfff)"
error_symbol = "[✗](bold #f7768e)"
vicmd_symbol = "[❮](bold #9ece6a)"

# ── Directorio ──────────────────────────────
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #7dcfff"
repo_root_style = "#bb9af7"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# ── Git ─────────────────────────────────────
[git_branch]
format = "[$symbol$branch]($style)"
style = "italic #bb9af7"
truncation_length = 15

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#e0af68"

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "#bb9af7"
conflicted = " "
ahead = " ⇡$count"
behind = " ⇣$count"
diverged = " ⇕⇡$ahead_count⇣$behind_count"
up_to_date = ""
untracked = " ?"
modified = " "
staged = " +$count"
renamed = " →"
deleted = " ✕"

# ── Tiempo de ejecución ─────────────────────
[cmd_duration]
min_time = 2000
format = "⏱️ [$duration]($style) "
style = "bold #e0af68"

# ── Hora actual ─────────────────────────────
[time]
disabled = false
time_format = "%T"
style = "#565f89"
format = "[$time]($style) "

# ── Estado de salida (si no es 0) ──────────
[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✗ "
style = "#f7768e"
pipestatus = false

# ── Versiones de lenguajes ─────────────────
[nodejs]
format = "via [⬢ $version]($style) "
style = "#9ece6a"
detect_folders = ["node_modules", ".node"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]

[python]
format = "via [🐍 $version( \\($virtualenv\\))]($style) "
style = "#e0af68"
detect_folders = [".venv", ".env", "venv", "env"]
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", "poetry.lock"]
detect_extensions = ["py", "pyi", "ipynb"]
detect_env_vars = ["VIRTUAL_ENV", "CONDA_DEFAULT_ENV"]

[rust]
format = "via [🦀 $version]($style) "
style = "#f7768e"
detect_folders = []
detect_files = ["Cargo.toml"]
detect_extensions = ["rs"]

[golang]
format = "via [🐹 $version]($style) "
style = "#7dcfff"
detect_folders = []
detect_files = ["go.mod", "go.sum"]
detect_extensions = ["go"]

# ── Fill (ocupa espacio entre izquierda y derecha) ──
[fill]
symbol = " "
